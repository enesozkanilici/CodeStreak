<script>
    // --- STATE MANAGEMENT ---
    let currentUser = "";
    let isGuest = true;
    let userElo = 1000;
    let userStats = {};
    
    // --- SAYFA YÜKLENDİĞİNDE OTOMATİK GİRİŞ KONTROLÜ ---
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const savedUser = urlParams.get('user');
        
        if (savedUser) {
            if (savedUser === "GUEST") {
                guestLogin();
            } else {
                currentUser = savedUser;
                isGuest = false;
                loadUserData();
                switchView("menu-view");
                updateMenuUI();
            }
        }
    };

    // --- LOGIN LOGIC ---
    function login() {
        const name = document.getElementById("username-input").value.trim().toUpperCase();
        if (!name) { alert("Lütfen bir kullanıcı adı girin!"); return; }
        
        // URL'i güncelle ve sayfayı yenilemeden geçiş yap
        const newUrl = window.location.origin + window.location.pathname + "?user=" + name;
        window.history.pushState({path:newUrl}, '', newUrl);
        
        currentUser = name;
        isGuest = false;
        loadUserData();
        switchView("menu-view");
        updateMenuUI();
    }

    function guestLogin() {
        const newUrl = window.location.origin + window.location.pathname + "?user=GUEST";
        window.history.pushState({path:newUrl}, '', newUrl);
        
        currentUser = "MİSAFİR";
        isGuest = true;
        userElo = 1000;
        userStats = {};
        switchView("menu-view");
        updateMenuUI();
    }

    function logout() {
        saveUserData();
        // URL parametresini temizle
        window.history.pushState({}, document.title, window.location.pathname);
        currentUser = "";
        document.getElementById("username-input").value = "";
        switchView("login-view");
    }

    // ... (loadUserData, saveUserData, startQuiz, loadNextQuestion, processAnswer vb. fonksiyonların aynı kalacak) ...
</script>
